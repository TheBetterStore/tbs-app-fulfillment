AWSTemplateFormatVersion: 2010-09-09
Description: >-
  The Better Store Fulfillment API

Transform:
  - AWS::Serverless-2016-10-31

Parameters:
  Environment:
    Type: String
    Default: prod

  InfraBaseCFName:
    Type: String

  AppAdminCFName:
    Type: String

  AppLoginCFName:
    Type: String

  OrderCFStackName:
    Type: String
    Default: tbs-app-order-prod

  SreErrorHandlerCFStackName:
    Type: String
    Default: tbs-sre-errorhandler-prod

  OrderConfirmedReservedConcurrency:
    Type: String
    Default: 2

  PaymentApiUrl:
    Type: String
    Default: https://api.thebetterstore.net

  AppLoggingLevel:
    Type: String
    AllowedValues: [TRACE, DEBUG, INFO, WARN, ERROR, FATAL]
    Default: INFO

  SystemLogLevel:
    Type: String
    AllowedValues: [DEBUG, INFO, WARN]
    Default: INFO

Resources:

  OrderConfirmedFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: index.handler
      Runtime: nodejs22.x
      MemorySize: 512
      Timeout: 10
      AutoPublishAlias: prod
      Description: Order confirmed event fulfillment function
      Tracing: Active
      DeadLetterQueue:
        TargetArn: !GetAtt OrderConfirmedFunctionDLQ.Arn
        Type: SQS
      DeploymentPreference:
        Type: AllAtOnce
      ReservedConcurrentExecutions: !Sub ${OrderConfirmedReservedConcurrency}
      LoggingConfig:
        LogGroup: !Ref OrderConfirmedFunctionLogs
        LogFormat: JSON
        ApplicationLogLevel: !Ref AppLoggingLevel
        SystemLogLevel: !Ref SystemLogLevel
      Environment:
        Variables:
          TBS_EVENTBUS_ARN:
            Fn::ImportValue: !Sub ${InfraBaseCFName}:TbsEventBusArn
      Policies:
        - Statement:
            - Effect: Allow
              Action: events:PutEvents
              Resource:
                Fn::ImportValue: !Sub ${InfraBaseCFName}:TbsEventBusArn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}*"
    Metadata: # Manage esbuild properties
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2020"
        Sourcemap: true
        EntryPoints:
          - src/application/event-handlers/order-confirmed/index.ts

  OrderConfirmedFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-OrderConfirmedFunction"
      RetentionInDays: 365

  OrderConfirmedEventRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Subscribe to order paid events
      EventBusName:
        Fn::ImportValue: !Sub ${InfraBaseCFName}:TbsEventBusArn
      EventPattern:
        source:
          - !Sub ${OrderCFStackName}-DynamoDbStreamEventPipe
        detail-type:
          - 'OrderEvent'
      State: ENABLED
      Targets:
        - Id: OrderConfirmed
          Arn: !GetAtt OrderConfirmedFunction.Arn

  OrderConfirmedRulePermissions:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OrderConfirmedFunction
      Action: lambda:InvokeFunction
      Principal: "events.amazonaws.com"
      SourceArn: !GetAtt OrderConfirmedEventRule.Arn

  OrderConfirmedFunctionDLQEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      BatchSize: 1
      EventSourceArn: !GetAtt OrderConfirmedFunctionDLQ.Arn
      FunctionName:
        Fn::ImportValue: !Sub ${SreErrorHandlerCFStackName}:PersistDlqErrorFunction:Name

  OrderConfirmedFunctionDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-OrderConfirmedFunctionDLQ"

Outputs:

  OrderConfirmedFunctionName:
    Description: Function Name
    Value: !Ref OrderConfirmedFunction
    Export:
      Name: !Sub '${AWS::StackName}:OrderConfirmedFunction:Name'

  OrderConfirmedFunctionArn:
    Description: Function Arn
    Value: !GetAtt OrderConfirmedFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}:OrderConfirmedFunction:Arn'

  OrderConfirmedFunctionDLQName:
    Description: Queue Name
    Value: !GetAtt OrderConfirmedFunctionDLQ.QueueName
    Export:
      Name: !Sub '${AWS::StackName}:OrderConfirmedFunctionDLQ:Name'

  OrderConfirmedFunctionDLQArn:
    Description: Queue Arn
    Value: !GetAtt OrderConfirmedFunctionDLQ.Arn
    Export:
      Name: !Sub '${AWS::StackName}:OrderConfirmedFunctionDLQ:Arn'

  OrderConfirmedFunctionDLQUrl:
    Description: Queue Url
    Value: !Ref OrderConfirmedFunctionDLQ
    Export:
      Name: !Sub '${AWS::StackName}:OrderConfirmedFunctionDLQ:Url'